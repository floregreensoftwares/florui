[package]
name = "florui-example-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "florui_example_app"

[[bin]]
name = "florui-example-app"
path = "src/main.rs"

[dependencies]
florui = { path = "../../crates/florui" }
florui-reactive = { path = "../../crates/florui-reactive" }

[dev-dependencies]
florui-style = { path = "../../crates/florui-style" }
florui-layout = { path = "../../crates/florui-layout" }
florui-paint = { path = "../../crates/florui-paint" }
florui-platform = { path = "../../crates/florui-platform" }
florui-devtools = { path = "../../crates/florui-devtools" }
taffy = "0.14"
winit = "0.30.13"
softbuffer = "0.4.8"
notify = "8.2.0"

[build-dependencies]
florui-build = { path = "../../crates/florui-build" }
