[package]
name = "florui-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "florui_platform"

[features]
default = ["desktop"]
# winit/softbuffer/notify/wgpu/pollster are only needed by the desktop
# host, not by the window-independent UiRuntime — a mobile or game host
# driving UiRuntime on its own shouldn't have to pull them in.
# `dep:windows-sys` is a no-op outside the Windows-only dependency table
# below — every other target simply never has it in its resolved graph.
desktop = ["dep:notify", "dep:softbuffer", "dep:winit", "dep:wgpu", "dep:pollster", "dep:windows-sys", "dep:florui-icon"]

[dependencies]
florui = { path = "../florui" }
florui-layout = { path = "../florui-layout" }
florui-paint = { path = "../florui-paint" }
florui-reactive = { path = "../florui-reactive" }
florui-style = { path = "../florui-style" }
florui-text = { path = "../florui-text" }
# Only the plain `RawIcon` type -- decoding an actual SVG/PNG is the
# caller's own concern (see `florui_icon`'s own `decode` feature), so its
# `resvg`/`image` dependencies never enter this crate's graph.
florui-icon = { path = "../florui-icon", optional = true, default-features = false }
notify = { version = "8.2.0", optional = true }
softbuffer = { version = "0.4.8", optional = true }
taffy = "0.14"
winit = { version = "0.30.13", optional = true }
# `desktop`'s own real GPU presentation path (see `gpu`'s own module
# doc) — `softbuffer` stays the CPU fallback. Versions match
# `florui-devtools`'s own existing use of both, for one resolved version
# across the workspace.
wgpu = { version = "29.0.4", optional = true }
pollster = { version = "1.0.1", optional = true }

# `crate::os::windows`'s own dependency — real Win32 calls (DWM caption
# color, click-through, tray icon). Target-scoped so every other
# platform's dependency graph never has it at all, not merely unused.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
] }
