[package]
name = "florui-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "florui_platform"

[features]
default = ["desktop"]
# winit/softbuffer/notify are only needed by the desktop host, not by the
# window-independent UiRuntime — a mobile or game host driving UiRuntime
# on its own shouldn't have to pull them in.
desktop = ["dep:notify", "dep:softbuffer", "dep:winit"]

[dependencies]
florui = { path = "../florui" }
florui-layout = { path = "../florui-layout" }
florui-paint = { path = "../florui-paint" }
florui-reactive = { path = "../florui-reactive" }
florui-style = { path = "../florui-style" }
notify = { version = "8.2.0", optional = true }
softbuffer = { version = "0.4.8", optional = true }
taffy = "0.14"
winit = { version = "0.30.13", optional = true }
