[package]
name = "florui-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "florui"
path = "src/main.rs"

[dependencies]
florui-devtools = { path = "../florui-devtools" }
florui-conformance = { path = "../florui-conformance" }
clap = { version = "4.6.6", features = ["derive", "env"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
