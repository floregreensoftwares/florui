[package]
name = "florui-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
florui-primitives = { path = "../florui-primitives" }
florui-view-syntax = { path = "../florui-view-syntax" }

[dev-dependencies]
# Doctests expand `view!`/`#[component]`, whose generated code refers to
# `::florui::*` — so the doctests need the facade crate that re-exports
# this one, even though that is the reverse of the normal dependency
# direction. Dev-dependencies are exempt from Cargo's cycle check.
florui = { path = "../florui" }
