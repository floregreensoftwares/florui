[workspace]
resolver = "3"
members = [
    "crates/florui-devtools",
    "crates/florui-cli",
    "crates/florui-primitives",
    "crates/florui-macros",
    "crates/florui",
    "crates/florui-conformance",
    "crates/florui-build",
    "crates/florui-style",
    "crates/florui-layout",
    "crates/florui-text",
    "crates/florui-paint",
    "crates/florui-platform",
    "crates/florui-reactive",
    "crates/florui-style-stylo-experiment",
    "examples/florui-example-app",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
